<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/icon.png">
  <title>Quest - Tracker</title>
  <link rel="stylesheet" href="/src/styles/main.css">
</head>

<body class="bg-gray-900 text-white">
  <main class="tracker-page">
    <div class="habit-tracker-shell tracker-fullscreen">
      <div id="monthHeader" class="month-header">
        <div class="month-header-left">
          <button id="prevMonthBtn" class="month-nav-btn" type="button" aria-label="Previous month">
            &larr;
          </button>
          <h3 id="monthLabel" class="text-xl font-semibold"></h3>
          <button id="nextMonthBtn" class="month-nav-btn" type="button" aria-label="Next month">
            &rarr;
          </button>
        </div>
      </div>

      <div id="habitGrid" class="habit-grid-wrapper"></div>

      <div id="habitActions" class="habit-actions">
        <div class="quest-input-group">
          <input
            id="newHabitInput"
            class="habit-input"
            type="text"
            placeholder="Add a quest (max 10)"
            maxlength="40"
          >
          <button id="addHabitBtn" class="bg-blue-500 px-4 py-2" type="button">
            Add Quest
          </button>
          <button id="copyHabitsBtn" class="month-action-btn" type="button">
            Copy Quests
          </button>
          <button id="pasteHabitsBtn" class="month-action-btn" type="button" disabled>
            Paste Quests
          </button>
          <button id="deleteAllHabitsBtn" class="month-action-btn danger-action-btn" type="button" disabled>
            Delete All Quests
          </button>
          <button id="freshStartBtn" class="month-action-btn danger-action-btn" type="button">
            Fresh Start
          </button>
        </div>
        <span id="clipboardStatus" class="clipboard-status" aria-live="polite"></span>
      </div>
    </div>
  </main>

  <div
    id="deleteMonthModal"
    class="modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-labelledby="deleteModalTitle"
  >
    <div class="modal-card">
      <h3 id="deleteModalTitle">Delete all quests for <span id="deleteModalMonthLabel"></span>?</h3>
      <p>
        This action permanently deletes quests and tracked progress for this month only.
        Data in other months will remain unchanged.
      </p>
      <div class="modal-actions">
        <button id="cancelDeleteMonthBtn" class="month-action-btn modal-btn" type="button">Cancel</button>
        <button id="confirmDeleteMonthBtn" class="month-action-btn modal-btn-danger" type="button">
          Delete Month Quests
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/ts/habits-page.ts"></script>

</body>
</html>
